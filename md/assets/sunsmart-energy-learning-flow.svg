<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">SunSmart solar energy learning flow</title>
  <desc id="desc">A realistic-looking low-voltage solar experiment showing a solar panel connected through an INA219 sensor and breadboard to an Arduino, with a multimeter measuring voltage and current. The flow explains voltage, current, power, and energy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f5"/>
      <stop offset="1" stop-color="#dcecf2"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7c99e"/>
      <stop offset="1" stop-color="#c89c68"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#234c70"/>
      <stop offset="0.5" stop-color="#3979a2"/>
      <stop offset="1" stop-color="#102d4d"/>
    </linearGradient>
    <linearGradient id="arduino" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#179b83"/>
      <stop offset="1" stop-color="#08705f"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf8"/>
      <stop offset="1" stop-color="#cbd5d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#31515c" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="woodgrain" width="120" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 12 C28 3 48 20 75 10 S105 8 120 15" fill="none" stroke="#9d7048" stroke-opacity=".18" stroke-width="3"/>
      <path d="M-20 29 C12 20 35 36 60 28 S105 25 140 32" fill="none" stroke="#f6dfb6" stroke-opacity=".25" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ef8354"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1190" cy="104" r="130" fill="#f7c948" opacity=".22" filter="url(#soft)"/>
  <circle cx="184" cy="166" r="105" fill="#62b6cb" opacity=".14" filter="url(#soft)"/>

  <text x="70" y="76" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#173f4f">From sunlight to useful energy</text>
  <text x="72" y="112" font-family="Arial, sans-serif" font-size="19" fill="#45636b">A hands-on path through voltage, current, power, energy, solar panels, and Arduino</text>

  <rect x="48" y="150" width="1304" height="566" rx="28" fill="url(#bench)" filter="url(#shadow)"/>
  <rect x="48" y="150" width="1304" height="566" rx="28" fill="url(#woodgrain)"/>
  <path d="M48 184 H1352" stroke="#f7e0b7" stroke-opacity=".55" stroke-width="5"/>

  <!-- Sun and solar panel -->
  <g transform="translate(112 250)" filter="url(#shadow)">
    <circle cx="102" cy="-42" r="48" fill="#f6c344" stroke="#e39b27" stroke-width="7"/>
    <g stroke="#e39b27" stroke-width="6" stroke-linecap="round">
      <path d="M102 -112v-24 M102 28v24 M32 -42H8 M196 -42h24 M52 -92L35 -109 M152 -92l17 -17 M52 8L35 25 M152 8l17 17"/>
    </g>
    <rect x="0" y="42" width="248" height="178" rx="8" fill="#273b4d" stroke="#142735" stroke-width="9"/>
    <rect x="13" y="55" width="222" height="152" rx="3" fill="url(#panel)"/>
    <g stroke="#9fd6e5" stroke-opacity=".7" stroke-width="2">
      <path d="M68 55v152 M124 55v152 M180 55v152 M13 105h222 M13 156h222"/>
    </g>
    <g stroke="#bde7f0" stroke-opacity=".35" stroke-width="4">
      <path d="M22 66L230 192 M80 57L234 145 M21 166L142 207"/>
    </g>
    <rect x="96" y="219" width="54" height="10" rx="5" fill="#253640"/>
    <text x="124" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#173f4f">SOLAR PANEL</text>
    <text x="124" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#36545b">sunlight in</text>
  </g>

  <!-- wires from panel -->
  <path d="M350 540 C420 540 408 370 480 370 C535 370 520 505 582 505" fill="none" stroke="#d84a42" stroke-width="8" stroke-linecap="round"/>
  <path d="M350 565 C420 565 423 610 486 610 C530 610 522 552 582 552" fill="none" stroke="#263c4b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="350" cy="540" r="8" fill="#f6dfb6" stroke="#d84a42" stroke-width="4"/>
  <circle cx="350" cy="565" r="8" fill="#f6dfb6" stroke="#263c4b" stroke-width="4"/>

  <!-- INA219 breakout -->
  <g transform="translate(530 438)" filter="url(#shadow)">
    <rect width="160" height="112" rx="10" fill="#1c8b79" stroke="#11594f" stroke-width="6"/>
    <rect x="20" y="25" width="88" height="47" rx="4" fill="#d8a94e" stroke="#855d26" stroke-width="3"/>
    <path d="M29 37h70 M29 51h70 M29 65h70" stroke="#6c4b24" stroke-width="3"/>
    <g fill="#d7e5e2"><circle cx="134" cy="25" r="6"/><circle cx="134" cy="48" r="6"/><circle cx="134" cy="71" r="6"/><circle cx="134" cy="94" r="6"/></g>
    <text x="80" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#eef8f5">INA219</text>
  </g>
  <text x="610" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173f4f">measure current + voltage</text>

  <!-- breadboard -->
  <g transform="translate(772 420) rotate(-2 0 0)" filter="url(#shadow)">
    <rect width="220" height="168" rx="10" fill="#f3f4e9" stroke="#bdc5b7" stroke-width="6"/>
    <rect x="15" y="18" width="190" height="9" rx="4" fill="#d9534f"/>
    <rect x="15" y="141" width="190" height="9" rx="4" fill="#4c8bca"/>
    <g fill="#7c8c87">
      <circle cx="35" cy="56" r="3"/><circle cx="50" cy="56" r="3"/><circle cx="65" cy="56" r="3"/><circle cx="80" cy="56" r="3"/><circle cx="95" cy="56" r="3"/><circle cx="125" cy="56" r="3"/><circle cx="140" cy="56" r="3"/><circle cx="155" cy="56" r="3"/><circle cx="170" cy="56" r="3"/><circle cx="185" cy="56" r="3"/>
      <circle cx="35" cy="78" r="3"/><circle cx="50" cy="78" r="3"/><circle cx="65" cy="78" r="3"/><circle cx="80" cy="78" r="3"/><circle cx="95" cy="78" r="3"/><circle cx="125" cy="78" r="3"/><circle cx="140" cy="78" r="3"/><circle cx="155" cy="78" r="3"/><circle cx="170" cy="78" r="3"/><circle cx="185" cy="78" r="3"/>
      <circle cx="35" cy="100" r="3"/><circle cx="50" cy="100" r="3"/><circle cx="65" cy="100" r="3"/><circle cx="80" cy="100" r="3"/><circle cx="95" cy="100" r="3"/><circle cx="125" cy="100" r="3"/><circle cx="140" cy="100" r="3"/><circle cx="155" cy="100" r="3"/><circle cx="170" cy="100" r="3"/><circle cx="185" cy="100" r="3"/>
    </g>
    <path d="M54 74 C73 38 118 125 158 74" fill="none" stroke="#d84a42" stroke-width="4"/>
    <path d="M70 102 C96 133 119 38 170 103" fill="none" stroke="#263c4b" stroke-width="4"/>
    <rect x="103" y="69" width="22" height="35" rx="3" fill="#d5a05b" stroke="#754c2b" stroke-width="2"/>
  </g>
  <text x="882" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173f4f">breadboard test circuit</text>

  <!-- Arduino -->
  <g transform="translate(1040 430) rotate(3 0 0)" filter="url(#shadow)">
    <rect width="230" height="150" rx="9" fill="url(#arduino)" stroke="#075243" stroke-width="7"/>
    <rect x="37" y="44" width="76" height="51" rx="4" fill="#c7d8d4" stroke="#477b73" stroke-width="3"/>
    <circle cx="57" cy="69" r="10" fill="#1c8b79"/><circle cx="91" cy="69" r="10" fill="#f0c04b"/>
    <rect x="133" y="48" width="56" height="43" rx="5" fill="#175b56"/>
    <g fill="#e0bc4a"><circle cx="14" cy="25" r="4"/><circle cx="14" cy="47" r="4"/><circle cx="14" cy="69" r="4"/><circle cx="14" cy="91" r="4"/><circle cx="14" cy="113" r="4"/><circle cx="216" cy="25" r="4"/><circle cx="216" cy="47" r="4"/><circle cx="216" cy="69" r="4"/><circle cx="216" cy="91" r="4"/><circle cx="216" cy="113" r="4"/></g>
    <text x="115" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f1faf4">ARDUINO</text>
  </g>
  <path d="M992 503 C1012 503 1018 503 1040 503" fill="none" stroke="#263c4b" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="1155" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173f4f">read, calculate, decide</text>

  <!-- multimeter -->
  <g transform="translate(410 225) rotate(-7 0 0)" filter="url(#shadow)">
    <rect width="170" height="225" rx="18" fill="url(#meter)" stroke="#7d8b88" stroke-width="7"/>
    <rect x="25" y="24" width="120" height="57" rx="6" fill="#203b3d" stroke="#425d5b" stroke-width="4"/>
    <text x="85" y="61" text-anchor="middle" font-family="monospace" font-size="25" font-weight="700" fill="#b9e5a4">12.6 V</text>
    <circle cx="85" cy="135" r="38" fill="#e8ece7" stroke="#788883" stroke-width="5"/>
    <path d="M56 143 A32 32 0 0 1 114 143" fill="none" stroke="#344f51" stroke-width="5"/>
    <path d="M85 136 L106 118" stroke="#e05a47" stroke-width="5"/>
    <circle cx="85" cy="136" r="7" fill="#344f51"/>
    <circle cx="42" cy="195" r="8" fill="#d84a42"/><circle cx="85" cy="195" r="8" fill="#263c4b"/>
    <text x="85" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#445b5c">MULTIMETER</text>
  </g>
  <path d="M494 447 C468 482 445 500 417 535" fill="none" stroke="#d84a42" stroke-width="5"/>
  <path d="M524 447 C535 480 548 492 562 520" fill="none" stroke="#263c4b" stroke-width="5"/>

  <!-- concepts strip -->
  <rect x="105" y="665" width="1190" height="78" rx="18" fill="#173f4f" opacity=".96"/>
  <text x="145" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f6c344">VOLTAGE</text>
  <text x="292" y="713" font-family="Arial, sans-serif" font-size="23" fill="#f3f7f3">push</text>
  <text x="420" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#62b6cb">CURRENT</text>
  <text x="585" y="713" font-family="Arial, sans-serif" font-size="23" fill="#f3f7f3">flow</text>
  <text x="705" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ef8354">POWER</text>
  <text x="835" y="713" font-family="Arial, sans-serif" font-size="23" fill="#f3f7f3">V x I</text>
  <text x="970" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#a8d5ba">ENERGY</text>
  <text x="1120" y="713" font-family="Arial, sans-serif" font-size="23" fill="#f3f7f3">power over time</text>

  <text x="700" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#55727a">suniq Week 1 learning map | low-voltage educational prototype</text>
</svg>
