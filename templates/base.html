<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SunIQ smart solar-energy dashboard">
    <title>{% block title %}SunIQ{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('dashboard') }}">Sun<span>IQ</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('dashboard') }}#photo-story-heading">How I built and tested SunIQ</a>
        <a href="{{ url_for('dashboard') }}#creator-heading">About the creator</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
