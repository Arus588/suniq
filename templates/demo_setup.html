{% extends "base.html" %}
{% block title %}SunIQ | Your inverter{% endblock %}
{% block content %}
<section class="setup-screen"><p class="eyebrow">Your solar setup</p><h1>Choose your inverter.</h1><form id="inverter-setup" class="account-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Monitoring provider<select name="provider" required><option value="" disabled {% if not system.provider %}selected{% endif %}>Select a provider</option>{% for key, details in providers.items() %}<option value="{{ key }}" {% if system.provider == key %}selected{% endif %}>{{ details[0] }}</option>{% endfor %}</select></label><input type="hidden" name="name" value="{{ system.name or 'My home solar' }}"><label>Inverter model<input name="model" required maxlength="80" pattern=".*\S.*" placeholder="e.g. SE7600H" value="{{ system.model or '' }}"></label><label>Serial number<input name="serial" required maxlength="120" pattern=".*\S.*" placeholder="Inverter serial number" value="{{ system.serial or '' }}"></label><button class="primary-button" type="submit">Connect inverter</button></form><section id="connection-progress" class="connection-progress" hidden aria-labelledby="connection-heading"><h2 id="connection-heading">Connecting your inverter</h2><p id="connection-status" role="status" aria-live="polite">Preparing your workspace...</p><progress id="connection-bar" max="100" value="0" aria-label="Inverter connection progress"></progress><span id="connection-percent" aria-hidden="true">0%</span></section><script src="{{ url_for('static', filename='js/inverter-connection.js') }}" defer></script></section>
{% endblock %}
